# shortlinks — QRcodly fork deployed for 10BitWorks
# Single Coolify service (compose stack) under the Website project.
#
# Domains:
#   short.10bit.works → frontend (serves /u/<code> short-link redirects + UI)
#   api.10bit.works   → backend Fastify API
#
# Object storage: Garage (single-node) — MinIO was removed from Docker Hub in
# Sept 2026. The access key + bucket are auto-bootstrapped at first start via
# GARAGE_DEFAULT_* env vars (needs garage >= v2.3).
#
# Auth status: Clerk placeholder keys — sign-in will NOT work until the
# Authentik OIDC port lands. Public redirects (/u/<code>) need no auth.
# Billing/Stripe, Umami analytics, Sentry, Cloudflare custom-domains: placeholders.

services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shortlinks
      MYSQL_USER: shortlinks
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --max-connections=100
      - --innodb-buffer-pool-size=256M
      - --innodb-redo-log-capacity=128M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
    volumes:
      - shortlinks-db:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - shortlinks-redis:/data

  garage:
    image: ghcr.io/10bitworks/shortlinks-garage:latest
    restart: always
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: shortlinks
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - shortlinks-garage-meta:/var/lib/garage/meta
      - shortlinks-garage-data:/var/lib/garage/data

  backend:
    image: ghcr.io/10bitworks/shortlinks-backend:latest
    restart: always
    depends_on:
      - db
      - redis
      - garage
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "5001"
      BACKEND_URL: https://api.10bit.works
      BASE_URL: https://api.10bit.works
      FRONTEND_URL: https://short.10bit.works
      SHORT_URL_BASE_URL: https://short.10bit.works
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: shortlinks
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: shortlinks
      DB_MIGRATING: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ANALYTICS_ENCRYPTION_KEY: ${ANALYTICS_ENCRYPTION_KEY}
      DISABLE_RATE_LIMITING: "false"
      SMTP_HOST: smtp.placeholder.invalid
      SMTP_PORT: "587"
      SMTP_USER: placeholder
      SMTP_PASS: ${PLACEHOLDER_SECRET}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: us-east-1
      S3_UPLOAD_KEY: ${GARAGE_ACCESS_KEY}
      S3_UPLOAD_SECRET: ${GARAGE_SECRET_KEY}
      S3_BUCKET_NAME: shortlinks
      S3_PUBLIC_URL: https://api.10bit.works/s3
      SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
      SENTRY_ENVIRONMENT: production
      # Format-valid dummy publishable key (base64 of much-horny-46.clerk.accounts.dev$).
      # No '$' in the raw value so compose interpolation can't mangle it.
      CLERK_PUBLISHABLE_KEY: pk_test_bXVjaC1ob3JueS00Ni5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder_do_not_use_0123456789abcdef
      CLERK_WEBHOOK_SECRET_KEY: whsec_placeholder_do_not_use_0123456789abcdef
      UMAMI_HOST: https://umami.placeholder.invalid
      UMAMI_WEBSITE: shortlinks
      UMAMI_USERNAME: placeholder
      UMAMI_PASSWORD: ${PLACEHOLDER_SECRET}
      CLOUDFLARE_API_TOKEN: placeholder
      CLOUDFLARE_ZONE_ID: placeholder
      CLOUDFLARE_DCV_DELEGATION_TARGET: placeholder.dcv.placeholder.invalid
      STRIPE_SECRET_KEY: sk_test_placeholder_do_not_use
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_do_not_use
      STRIPE_PRO_PRICE_ID_MONTHLY: price_placeholder
      STRIPE_PRO_PRICE_ID_ANNUAL: price_placeholder
      STRIPE_ADDON_DOMAIN_PRICE_ID_MONTHLY: price_placeholder
      STRIPE_ADDON_DOMAIN_PRICE_ID_ANNUAL: price_placeholder
      GOOGLE_WEB_RISK_API_KEY: ""
      URL_SAFETY_RECHECK_MODE: shadow
      LOG_LEVEL: info
      TZ: America/Chicago

  frontend:
    image: ghcr.io/10bitworks/shortlinks-frontend:latest
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_FRONTEND_URL: https://short.10bit.works
      NEXT_PUBLIC_SHORT_URL_DOMAIN: https://short.10bit.works
      NEXT_PUBLIC_API_URL: https://api.10bit.works
      # Format-valid dummy publishable key (base64 of much-horny-46.clerk.accounts.dev$).
      # No '$' in the raw value so compose interpolation can't mangle it.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bXVjaC1ob3JueS00Ni5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder_do_not_use_0123456789abcdef
      CLERK_ENCRYPTION_KEY: ${PLACEHOLDER_SECRET}
      NEXT_PUBLIC_CLERK_JS_URL: /__clerk-js/dist/clerk.browser.min.js
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o0.ingest.sentry.io/0
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      # emptyStringAsUndefined makes AXIOM_TOKEN='' fail z.string() at startup —
      # use a non-empty placeholder until a real Axiom token is wired up.
      # Skip Clerk in middleware while placeholder keys are in place.
      AUTH_DISABLED: "true"
      AXIOM_TOKEN: placeholder-no-axiom
      AXIOM_DATASET: shortlinks
      NEXT_PUBLIC_GOOGLE_API_KEY: placeholder
      NEXT_PUBLIC_STRIPE_PRO_PRICE_ID_MONTHLY: price_placeholder
      NEXT_PUBLIC_STRIPE_PRO_PRICE_ID_ANNUAL: price_placeholder
      NEXT_PUBLIC_STRIPE_ADDON_DOMAIN_PRICE_ID_MONTHLY: price_placeholder
      NEXT_PUBLIC_STRIPE_ADDON_DOMAIN_PRICE_ID_ANNUAL: price_placeholder
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      LOG_LEVEL: info
      TZ: America/Chicago

volumes:
  shortlinks-db:
  shortlinks-redis:
  shortlinks-garage-meta:
  shortlinks-garage-data:
