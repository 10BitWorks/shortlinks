# Garage single-node config for the shortlinks stack (10bit.works).
# Baked into ghcr.io/10bitworks/shortlinks-garage at build time.
# Secrets (rpc_secret, admin_token) are passed at runtime via GARAGE_* env
# vars, which override file values in garage >= v2.3.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
advertise_endpoint = "http://garage:3900"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
